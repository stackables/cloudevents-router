name: Release
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# id-token: npm trusts this workflow (trusted publishing), so no npm token is needed. The rest is what
# changesets/action needs to open the Version Packages PR and create GitHub releases.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs pnpm and the Node version from .nvmrc, then runs the frozen install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Create Version Packages PR or publish
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm ci:publish
          create-github-releases: true
